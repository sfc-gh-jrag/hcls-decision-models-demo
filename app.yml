version: 2

name: MEMBER_DECISION_LAB
database: TEMP
schema: JRAG
query_warehouse: SNOWADHOC

label: "Snowflake Decision Fast"
description: "As a member types, snowflake-decision-fast decides queue, live-agent need and frustration. Decisions only; no generated replies. Synthetic text only."
icon: "public/icon.png"

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - output

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]
