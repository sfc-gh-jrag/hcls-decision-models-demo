version: 2

# Baseline uses the defaults from SAR account administrator setup.
# Override per account with a target below, or edit these four values.
name: MEMBER_DECISION_LAB
database: SNOWFLAKE_APPS
schema: PUBLIC
query_warehouse: SNOWFLAKE_APPS_QUERY_WH

label: "Snowflake Decision Fast"
description: "As a member types, snowflake-decision-fast decides queue, live-agent need and frustration. Decisions only; no generated replies. Synthetic text only."
icon: "public/icon.png"

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - output

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

default_target: shared

targets:
  # Shared database from account admin setup; can be granted to other roles.
  shared: {}
  # Your personal database (USER$<you>); quick to try, cannot be shared.
  dev:
    name: MEMBER_DECISION_LAB_DEV
    database: USER$
  # Original SE demo deployment (Snowhouse).
  snowhouse:
    database: TEMP
    schema: JRAG
    query_warehouse: SNOWADHOC

